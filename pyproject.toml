[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-rogues-tracker"
version = "0.4.2"
description = "Read-only Tiny Rogues save tracker with PySide6 desktop GUI"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "packaging>=23.0"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8.0"]

[project.scripts]
tiny-rogues-tracker = "tiny_rogues_tracker.gui:main"

[tool.setuptools.packages.find]
include = ["tiny_rogues_tracker", "tiny_rogues_tracker.*"]
exclude = ["build*", "dist*", "source_inputs*", "fixtures*", "tests*"]

[tool.setuptools.package-data]
tiny_rogues_tracker = ["assets/*"]
